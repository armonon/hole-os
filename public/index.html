<body>
<div id="hole-fluid-os">
  <div class="hf-os" data-layout="desktop" data-drawer-open="false" aria-label="Hole fluid operating system concept">
    <header class="hf-topbar">
      <button class="hf-brand cursor-interaction" data-home aria-label="Open Welcome">h<span>◎</span>le</button>
      <span class="hf-space-name">by thecreatingco.</span>
      <button class="hf-activity cursor-interaction" data-launch="Music"><span class="hf-activity-bars" aria-hidden="true"><b></b><b></b><b></b></span><span class="hf-activity-text">A little headspace</span></button>
      <span class="hf-concept">INTERACTION STUDY</span>
    </header>
    <div class="hf-controls">
      <div class="hf-layout" aria-label="Device layout"><button class="cursor-interaction" data-layout="pocket" aria-label="Pocket" aria-pressed="false"><i data-lucide="smartphone" aria-hidden="true"></i><span>Pocket</span></button><button class="cursor-interaction" data-layout="desktop" aria-label="Desktop" aria-pressed="true"><i data-lucide="monitor" aria-hidden="true"></i><span>Desktop</span></button></div>
      <div class="hf-workspace-controls hf-zoom" aria-label="Workspace scale"><button class="cursor-interaction" data-zoom="out" aria-label="Zoom workspace out"><i data-lucide="minus" aria-hidden="true"></i></button><button class="cursor-interaction hf-workspace-zoom-value" data-reset-workspace aria-label="Reset workspace view">100%</button><button class="cursor-interaction" data-zoom="in" aria-label="Zoom workspace in"><i data-lucide="plus" aria-hidden="true"></i></button></div>
      <div class="hf-drawer-controls" hidden><button class="hf-drawer-search cursor-interaction" data-search aria-label="Find an app"><i data-lucide="search" aria-hidden="true"></i><span>Find</span></button><div class="hf-zoom"><button class="cursor-interaction" data-zoom="out" aria-label="Zoom out"><i data-lucide="minus" aria-hidden="true"></i></button><button class="cursor-interaction hf-zoom-value" data-reset-universe aria-label="Reset drawer view">100%</button><button class="cursor-interaction" data-zoom="in" aria-label="Zoom in"><i data-lucide="plus" aria-hidden="true"></i></button></div><button class="hf-drawer-close cursor-interaction" data-close-drawer aria-label="Close App Drawer"><i data-lucide="x" aria-hidden="true"></i></button></div>
    </div>
    <div class="hf-field" aria-label="Workspace">
      <div class="hf-desktop" aria-label="Desktop">
        <div class="hf-desk-light" aria-hidden="true"></div>
        <nav class="hf-space-nav" aria-label="Desktop spaces">
          <button class="cursor-interaction" data-space="desk" aria-pressed="true"><i data-lucide="orbit" aria-hidden="true"></i>My desk</button>
          <button class="cursor-interaction" data-space="studio" aria-pressed="false">Studio</button>
          <button class="cursor-interaction" data-space="life" aria-pressed="false">Life</button>
          <span></span><button class="cursor-interaction hf-overview" data-space="overview" aria-label="Overview" aria-pressed="false"><i data-lucide="scan" aria-hidden="true"></i><span>Overview</span></button>
          <button class="cursor-interaction" data-arrange aria-label="Arrange files" aria-pressed="false"><i data-lucide="move" aria-hidden="true"></i><span>Arrange</span></button>
        </nav>
        <div class="hf-desk-stage" aria-label="Spatial worktable. Drag a file to place it; drag empty space to explore.">
          <div class="hf-desk-grid" aria-hidden="true"></div>
          <div class="hf-pocket-overview"><button class="cursor-interaction" data-space="desk"><i data-lucide="orbit" aria-hidden="true"></i><span>My desk<small>Your everyday space</small></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button><button class="cursor-interaction" data-space="studio"><i data-lucide="shapes" aria-hidden="true"></i><span>Studio<small>Make something good</small></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button><button class="cursor-interaction" data-space="life"><i data-lucide="sprout" aria-hidden="true"></i><span>Life<small>A little more you</small></span><i data-lucide="arrow-up-right" aria-hidden="true"></i></button></div>
          <div class="hf-desk-world">
            <div class="hf-island hf-island-desk" data-island="desk"><div class="hf-island-platform"></div><button class="hf-island-title cursor-interaction" data-space="desk"><span class="hf-island-kicker">YOUR EVERYDAY SPACE</span><strong>My desk</strong><small class="hf-space-count"></small></button></div>
            <div class="hf-island hf-island-studio" data-island="studio"><div class="hf-island-platform"></div><button class="hf-island-title cursor-interaction" data-space="studio"><span class="hf-island-kicker">MAKE SOMETHING GOOD</span><strong>Studio</strong><small class="hf-space-count"></small></button></div>
            <div class="hf-island hf-island-life" data-island="life"><div class="hf-island-platform"></div><button class="hf-island-title cursor-interaction" data-space="life"><span class="hf-island-kicker">A LITTLE MORE YOU</span><strong>Life</strong><small class="hf-space-count"></small></button></div>
            <div class="hf-desk-items"></div>
          </div>
        </div>
        <div class="hf-arrange-bar" hidden><span class="hf-selected-name">Select a file</span><label>Place in <select aria-label="Move selected file to space" disabled><option value="desk">My desk</option><option value="studio">Studio</option><option value="life">Life</option></select></label><button class="cursor-interaction" data-arrange>Done</button></div>
        <div class="hf-desk-caption"><span class="hf-desk-status">Everything has a place.</span><span class="hf-desk-gesture"><i data-lucide="hand" aria-hidden="true"></i>Drag to explore</span></div>
      </div>
      <div class="hf-windows"></div>
      <section class="hf-drawer" id="hole-app-drawer" aria-label="App Drawer" hidden inert>
        <div class="hf-aura" aria-hidden="true"></div>
        <div class="hf-bubbles" aria-label="Apps. Drag the space to explore."></div>
      </section>
      <div class="hf-search-panel" hidden>
        <div class="hf-search-head"><i data-lucide="search" aria-hidden="true"></i><input type="search" placeholder="Where do you want to go?" aria-label="Find an app"><button class="cursor-interaction" data-dismiss-search aria-label="Close search">×</button></div>
        <div class="hf-search-results"></div>
      </div>
    </div>
    <footer class="hf-bottom">
      <p class="hf-hint" aria-live="polite">Your workspace. Your pace.</p>
      <nav class="hf-dock" aria-label="Home, pinned and recent apps">
        <button class="hf-dock-button cursor-interaction" data-home aria-label="Spaces"><i data-lucide="orbit" aria-hidden="true"></i><span>Spaces</span></button>
        <button class="hf-dock-button hf-drawer-toggle cursor-interaction" data-drawer-toggle aria-label="App Drawer" aria-controls="hole-app-drawer" aria-expanded="false"><i data-lucide="layout-grid" aria-hidden="true"></i><span>App Drawer</span></button>
        <span class="hf-dock-divider" aria-hidden="true"></span>
        <div class="hf-dock-apps" role="group" aria-label="Pinned and recent apps"></div>
      </nav>
      <div class="hf-home-indicator" aria-hidden="true"></div>
    </footer>
  </div>
</div>
<style>
#hole-fluid-os{width:100%;display:flex;justify-content:center;padding:4px 0 10px;box-sizing:border-box}
#hole-fluid-os .hf-os{--hf-bg:light-dark(#f2f3f5,#151820);--hf-paper:light-dark(#fffefd,#262a34);--hf-ink:light-dark(#252b38,#f0f1f5);--hf-muted:light-dark(#727581,#a6aaba);--hf-line:light-dark(#dfe1e6,#383d49);--hf-soft:light-dark(#e8eaef,#303540);--hf-shadow:light-dark(#34365322,#00000066);--hf-accent:#707cf6;position:relative;isolation:isolate;width:100%;max-width:1024px;height:740px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--hf-line);border-radius:32px;color:var(--hf-ink);background:var(--hf-bg);font:13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 20px 50px var(--hf-shadow);transition:width .65s cubic-bezier(.22,.85,.18,1),border-radius .65s}
#hole-fluid-os .hf-os[data-layout=pocket]{width:390px;border-radius:42px}
#hole-fluid-os .hf-os *{box-sizing:border-box}
#hole-fluid-os button,#hole-fluid-os input,#hole-fluid-os textarea{font:inherit}
#hole-fluid-os button{color:inherit;border:0;-webkit-tap-highlight-color:transparent}
#hole-fluid-os button:focus-visible{outline:2px solid var(--hf-accent);outline-offset:4px}
#hole-fluid-os button:active{filter:brightness(.96)}
#hole-fluid-os [hidden]{display:none!important}
#hole-fluid-os .hf-topbar{height:72px;flex-shrink:0;padding:0 26px;display:flex;align-items:center;gap:20px;position:relative;z-index:4}
#hole-fluid-os .hf-brand{font-size:26px;font-weight:600;letter-spacing:-1.8px;background:transparent;padding:6px 0}
#hole-fluid-os .hf-brand span{font-weight:400;font-size:28px;display:inline-block;vertical-align:-1px;margin:0 1px}
#hole-fluid-os .hf-space-name{font-size:12px;color:var(--hf-muted);white-space:nowrap}
#hole-fluid-os .hf-activity{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:11px;border-radius:24px;padding:11px 17px;background:var(--hf-ink);color:var(--hf-paper);font-size:11px;white-space:nowrap;box-shadow:0 5px 15px var(--hf-shadow)}
#hole-fluid-os .hf-activity-bars{display:flex;align-items:center;gap:3px;height:16px}
#hole-fluid-os .hf-activity-bars b{display:block;width:3px;border-radius:2px;background:#bbbcff;height:7px;transition:height .25s}

#hole-fluid-os .hf-activity-bars b:nth-child(3){height:10px}
#hole-fluid-os .hf-concept{margin-left:auto;padding-right:78px;font-size:9px;letter-spacing:1.5px;color:var(--hf-muted)}
#hole-fluid-os .hf-controls{height:46px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 26px;z-index:3}
#hole-fluid-os .hf-layout{display:flex;background:var(--hf-soft);padding:4px;border-radius:22px;gap:3px}
#hole-fluid-os .hf-layout button{display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:18px;background:transparent;color:var(--hf-muted);font-size:11px;transition:background .3s,box-shadow .3s,color .3s}
#hole-fluid-os .hf-layout button[aria-pressed=true]{background:var(--hf-paper);color:var(--hf-ink);box-shadow:0 2px 5px var(--hf-shadow)}
#hole-fluid-os .hf-layout svg{width:14px;height:14px}
#hole-fluid-os .hf-zoom{display:flex;align-items:center;gap:4px}
#hole-fluid-os .hf-zoom button{display:grid;place-items:center;min-width:32px;height:34px;border-radius:50%;background:transparent;color:var(--hf-muted);font-size:11px}

#hole-fluid-os .hf-zoom svg{width:15px;height:15px}

#hole-fluid-os .hf-drawer-controls{display:flex;align-items:center;gap:12px}

#hole-fluid-os .hf-wallpaper span:first-child{width:460px;height:460px;right:-35px;bottom:-185px;background:radial-gradient(circle at 35% 30%,light-dark(#f6dfd0,#5f4859),light-dark(#c4b4df,#353656) 55%,light-dark(#889bbd,#1f2b43) 85%)}

#hole-fluid-os .hf-wallpaper span:nth-child(3){width:115px;height:115px;right:105px;top:65px;background:radial-gradient(circle at 30% 25%,light-dark(#f1e7f9,#8a7296),light-dark(#b0abd9,#45446e) 60%,light-dark(#909bbb,#303c56))}
#hole-fluid-os .hf-desktop-content{position:relative;width:min(400px,100%);padding:42px 0 0 45px}

#hole-fluid-os .hf-resume-card{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:17px;border-radius:23px;background:var(--hf-paper);box-shadow:0 5px 22px var(--hf-shadow)}
#hole-fluid-os .hf-resume-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;background:light-dark(#f4e6bd,#4b4230);color:light-dark(#9d771d,#e9c66e);flex-shrink:0}

#hole-fluid-os .hf-resume-card strong{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hole-fluid-os .hf-resume-card>svg{margin-left:auto;width:17px;height:17px;flex-shrink:0;color:var(--hf-muted)}
#hole-fluid-os .hf-desktop-shortcuts{display:flex;gap:12px;margin-top:16px}
#hole-fluid-os .hf-desktop-shortcuts button{display:flex;gap:8px;align-items:center;padding:11px 13px;border-radius:18px;background:var(--hf-paper);font-size:11px}
#hole-fluid-os .hf-desktop-shortcuts svg{width:17px;height:17px;color:var(--hf-muted)}
#hole-fluid-os .hf-desk-light{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 85%,light-dark(#d8c8f5aa,#36335088),transparent 60%),radial-gradient(ellipse at 15% 30%,light-dark(#e4e9deaa,#293c3b77),transparent 55%);pointer-events:none}
#hole-fluid-os .hf-space-nav{position:absolute;inset:8px 26px auto;display:flex;gap:5px;align-items:center;z-index:4}
#hole-fluid-os .hf-space-nav>span{flex:1}
#hole-fluid-os .hf-space-nav button{display:flex;gap:6px;align-items:center;justify-content:center;min-height:38px;padding:7px 12px;border-radius:16px;background:transparent;color:var(--hf-muted);font-size:12px;white-space:nowrap}
#hole-fluid-os .hf-space-nav button[aria-pressed=true]{background:var(--hf-paper);color:var(--hf-ink);box-shadow:0 4px 12px var(--hf-shadow)}
#hole-fluid-os .hf-space-nav svg{width:16px;height:16px}
#hole-fluid-os .hf-desk-stage{position:absolute;inset:56px 0 34px;overflow:hidden;touch-action:none;cursor:grab;perspective:1200px}
#hole-fluid-os .hf-desk-grid{position:absolute;inset:-90% -80%;background-image:radial-gradient(circle,var(--hf-muted) .85px,transparent 1px);background-size:34px 34px;transform:rotateX(60deg);opacity:.16;pointer-events:none;mask-image:radial-gradient(ellipse,#000 10%,transparent 60%)}
#hole-fluid-os .hf-desk-world{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate3d(var(--desk-x,0px),var(--desk-y,0px),0) scale(var(--desk-scale,1));transition:transform .8s cubic-bezier(.22,.9,.23,1);will-change:transform}
#hole-fluid-os .hf-desk-stage.is-dragging,#hole-fluid-os .hf-desk-stage.is-dragging button{cursor:grabbing}

#hole-fluid-os .hf-island{position:absolute;left:0;top:0;width:0;height:0}
#hole-fluid-os .hf-island-platform{position:absolute;width:440px;height:340px;left:-220px;top:-125px;border-radius:45%;transform:perspective(800px) rotateX(38deg) rotateZ(-7deg);background:linear-gradient(145deg,light-dark(#eeeff6,#303440),light-dark(#dce0eb,#222732));box-shadow:0 10px 0 light-dark(#c9cfdd,#20242f),0 35px 50px var(--hf-shadow),inset 0 1px 0 light-dark(#ffffffcc,#ffffff15);opacity:.85;transition:box-shadow .25s,filter .25s;pointer-events:none}
#hole-fluid-os .hf-island-studio .hf-island-platform{background:linear-gradient(135deg,light-dark(#ece4f6,#41394f),light-dark(#d5c9eb,#2f2d43));box-shadow:0 10px 0 light-dark(#bdb0d5,#252335),0 35px 50px var(--hf-shadow),inset 0 1px 0 light-dark(#ffffffcc,#ffffff20)}
#hole-fluid-os .hf-island-life .hf-island-platform{background:linear-gradient(135deg,light-dark(#e2ede2,#31453e),light-dark(#c6dbd2,#293b38));box-shadow:0 10px 0 light-dark(#b1c9be,#20312c),0 35px 50px var(--hf-shadow),inset 0 1px 0 light-dark(#ffffffcc,#ffffff20)}
#hole-fluid-os .hf-island.is-drop-target .hf-island-platform{filter:brightness(1.1);outline:2px dashed var(--hf-accent);outline-offset:10px}
#hole-fluid-os .hf-island-title{position:absolute;left:0;top:-175px;transform:translateX(-50%);width:210px;min-height:62px;text-align:center;display:flex;flex-direction:column;align-items:center;background:transparent;padding:4px;border-radius:12px}
#hole-fluid-os .hf-island-title strong{font-size:24px;font-weight:500;letter-spacing:-.8px}
#hole-fluid-os .hf-island-kicker{font-size:9px;letter-spacing:1.8px;color:var(--hf-muted)}
#hole-fluid-os .hf-space-count{font-size:11px;font-weight:400;color:var(--hf-muted);margin-top:2px}
#hole-fluid-os .hf-desk-item{position:absolute;left:0;top:0;width:132px;min-height:100px;transform:translate(-50%,-50%);background:transparent;padding:0;border-radius:14px;touch-action:none;transition:opacity .4s;cursor:grab;isolation:isolate}
#hole-fluid-os .hf-object-face{position:relative;display:flex;flex-direction:column;width:100%;height:112px;text-align:left;border-radius:13px;background:var(--hf-paper);box-shadow:0 12px 20px var(--hf-shadow),0 2px 1px light-dark(#c8cbd3,#10141d);transform:perspective(600px) rotateX(7deg) rotateY(-6deg) rotateZ(var(--turn,-5deg));transition:transform .45s cubic-bezier(.2,1.25,.3,1),box-shadow .4s;overflow:hidden;pointer-events:none}

#hole-fluid-os .hf-object-label{display:block;white-space:nowrap;text-align:center;font-size:calc(11px / var(--desk-scale,1));margin:12px -16px 0;color:var(--hf-ink);text-shadow:0 1px var(--hf-bg);pointer-events:none}

#hole-fluid-os .hf-files{display:flex;flex-direction:column;gap:7px}
#hole-fluid-os .hf-file{width:100%;display:flex;align-items:center;text-align:left;gap:12px;padding:13px 8px;border-radius:14px;background:transparent;font-size:12px}
#hole-fluid-os .hf-file:hover{background:var(--hf-soft)}
#hole-fluid-os .hf-file svg{color:#6f92eb;width:24px;height:24px;flex-shrink:0}
#hole-fluid-os .hf-file span{display:flex;flex-direction:column;gap:3px}
#hole-fluid-os .hf-file small{font-size:10px;color:var(--hf-muted)}
#hole-fluid-os .hf-photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
#hole-fluid-os .hf-photo-tile{height:110px;border-radius:16px;background:radial-gradient(ellipse at 30% 15%,#ffe6bd,#eaaf9e 40%,#8c87ba 75%,#5c6988)}
#hole-fluid-os .hf-photo-tile:nth-child(2){background:radial-gradient(ellipse at 75% 30%,#c4f7f2,#88bad0 40%,#666eb0 75%,#474c7e)}
#hole-fluid-os .hf-photo-tile:nth-child(3){background:radial-gradient(ellipse at 40% 80%,#f9e99c,#aacb9f 45%,#5e9394 75%,#3b5f7a)}
#hole-fluid-os .hf-photo-tile:nth-child(4){background:radial-gradient(ellipse at 50% 15%,#f9c8df,#c29cd6 40%,#8e9ec8 75%,#56768d)}
#hole-fluid-os .hf-app-hero{height:150px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--app-color),#fff 28%),var(--app-color));color:#fff}
#hole-fluid-os .hf-app-hero svg{width:54px;height:54px;stroke-width:1.2}
#hole-fluid-os .hf-app-detail{background:var(--hf-soft);border-radius:17px;padding:15px;margin-top:15px;font-size:12px}
#hole-fluid-os .hf-search-panel{position:absolute;z-index:50;left:50%;top:26px;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:var(--hf-paper);border-radius:23px;box-shadow:0 22px 90px var(--hf-shadow);border:1px solid var(--hf-line);padding:14px}
#hole-fluid-os .hf-search-head{display:flex;align-items:center;gap:10px;padding:3px 4px 12px;border-bottom:1px solid var(--hf-line)}
#hole-fluid-os .hf-search-head>svg{width:19px;flex-shrink:0;color:var(--hf-muted)}
#hole-fluid-os .hf-search-head input{min-width:0;width:100%;font-size:16px;border:0;background:transparent;color:var(--hf-ink);padding:5px 0}
#hole-fluid-os .hf-search-head button{background:var(--hf-soft);border-radius:50%;font-size:20px;min-width:30px;height:30px}
#hole-fluid-os .hf-search-results{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding-top:10px;max-height:300px;overflow:auto}
#hole-fluid-os .hf-search-results button{display:flex;align-items:center;gap:10px;text-align:left;border-radius:13px;padding:11px;background:transparent;font-size:12px;min-height:44px}
#hole-fluid-os .hf-search-results button:hover{background:var(--hf-soft)}
#hole-fluid-os .hf-search-results svg{width:18px;height:18px;color:var(--result-color);flex-shrink:0}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-space-name,#hole-fluid-os .hf-os[data-layout=pocket] .hf-concept{display:none}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-topbar{padding:0 22px}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-activity{left:auto;right:22px;transform:none}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-controls{padding:0 18px}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-drawer-controls{gap:3px}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-drawer-search span{display:none}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-desktop-content{padding:32px 24px 0;width:100%}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-desktop-content h1{font-size:37px}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-wallpaper span:first-child{right:-220px}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-wallpaper span:nth-child(2){right:110px;bottom:-160px}
#hole-fluid-os .hf-os[data-layout=pocket] .hf-wallpaper span:nth-child(3){right:-45px;top:20px}

    min:.45,max:2.2,settled:()=>settleWorkspaceZoom(),anchor:p=>rememberZoomSpace(p),tap:p=>focusWorkspace(p),get:()=>{const c=currentDeskView();return{x:c.tx,y:c.ty,z:c.tz};},current:()=>{const c=currentDeskView();return{x:c.x,y:c.y,z:c.z};},set:setDeskView,
    file:target=>state.desk.view==='overview'?null:deskFiles.find(f=>f.el===target.closest('[data-file]')),
    previewFile:(g,e)=>{const w=deskStage.clientWidth,h=deskStage.clientHeight;g.preview={x:Math.max(53,Math.min(w-53,g.point.x+(e.clientX-g.startX)/g.c.z)),y:Math.max(48,Math.min(h-48,g.point.y+(e.clientY-g.startY)/g.c.z))};g.file.el.style.left=g.preview.x+'px';g.file.el.style.top=g.preview.y+'px';window.HoleClusters?.previewDrag(g,e);},
    commitFile:(g,e)=>{if(!deskFiles.includes(g.file)||!g.file.el.isConnected||!state.desk.files[g.file.id]){window.HoleClusters?.cancelDrag();return;}if(!window.HoleClusters?.commitDrag(g,e)){const p=g.preview||g.point;positionFile(g.file,p.x,p.y);hint.textContent=g.file.name+' placed.';}},
    cancelFile:g=>{window.HoleClusters?.cancelDrag();g.file.el.classList.remove('is-held');paintDesk();},
    active:value=>{deskDrag=value?{}:null;}
  });

    min:.65,max:1.8,tap:p=>focusDrawer(p),get:()=>({x:camera.tx,y:camera.ty,z:camera.tz/fit}),current:()=>({x:camera.x,y:camera.y,z:camera.z/fit}),
    set:(v,immediate=false)=>{camera.tx=v.x;camera.ty=v.y;camera.tz=Math.max(fit*.65,Math.min(fit*1.8,v.z*fit));clampCamera();if(immediate)Object.assign(camera,{x:camera.tx,y:camera.ty,z:camera.tz});hover=null;kick();},

  bubbleLayer.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||drawerGestures.active)return;const r=field.getBoundingClientRect();hover={x:e.clientX-r.left,y:e.clientY-r.top};kick();});

  root.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search();return;}
    if(e.key==='Escape'){e.preventDefault();if(desktopGestures.active||drawerGestures.active){desktopGestures.cancel();drawerGestures.cancel();return;}if(!searchPanel.hidden){dismissSearch();return;}if(drawerOpen){closeDrawer();return;}if(arranging){arranging=false;paintDesk();deskHint();root.querySelector('[data-arrange]').focus();return;}const top=[...windows.values()].filter(r=>!r.el.hidden).sort((a,b)=>Number(b.el.style.zIndex)-Number(a.el.style.zIndex))[0];if(top)minimize(top);else desktopGestures.reset();return;}
    if(e.target.closest('input,textarea,select,[contenteditable],.hf-window,.hf-search-panel,.hf-dock'))return;
    if(e.code==='Space'){if(!spaceHeld)spacePanUsed=false;spaceHeld=true;os.classList.add('is-space-pan');if(!e.target.closest('button'))e.preventDefault();}

    if(['+','=','-','0'].includes(e.key)){e.preventDefault();if(e.key==='0')active.reset();else active.zoom(e.key==='-'?1/1.2:1.2);return;}
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const dx=e.key==='ArrowLeft'?60:e.key==='ArrowRight'?-60:0,dy=e.key==='ArrowUp'?60:e.key==='ArrowDown'?-60:0;if(drawerOpen){camera.tx+=dx;camera.ty+=dy;clampCamera();kick();}else{const c=currentDeskView();setDeskView({x:c.tx+dx,y:c.ty+dy,z:c.tz});}save();}
  });
  root.addEventListener('keyup',e=>{if(e.code==='Space'&&spacePanUsed){e.preventDefault();e.stopPropagation();spaceHeld=false;spacePanUsed=false;os.classList.remove('is-space-pan');}},true);
  window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceHeld=false;spacePanUsed=false;os.classList.remove('is-space-pan');}});

  function emitWindow(type,rec){root.dispatchEvent(new CustomEvent('hole:window-change',{detail:{type,rec}}));}
  function renderSpaces(){
    orbitMap.replaceChildren();
    for(const [id,s] of Object.entries(spaces)){
      const button=document.createElement('button');button.type='button';button.className='hf-space-orbit cursor-interaction';button.dataset.space=id;button.setAttribute('aria-label','Enter '+s.name);
      button.innerHTML='<span class="hf-orbit-sphere"><span class="hf-orbit-contents"></span></span><strong></strong><small></small>';
      button.querySelector('strong').textContent=s.name;orbitMap.append(button);
      if(!deskViews[id])deskViews[id]={x:0,y:0,z:1,tx:0,ty:0,tz:1};
      if(!root.querySelector('.hf-space-nav [data-space="'+id+'"]')){const nav=document.createElement('button');nav.type='button';nav.dataset.space=id;nav.className='cursor-interaction';nav.textContent=s.name;root.querySelector('.hf-space-nav').insertBefore(nav,root.querySelector('.hf-space-nav>span'));}
      if(![...moveSelect.options].some(o=>o.value===id)){const option=document.createElement('option');option.value=id;option.textContent=s.name;moveSelect.append(option);}
    }
    orbitMap.dataset.many=String(Object.keys(spaces).length>3);icons();
  }
  function showSpaceForm(){
    if(root.querySelector('.hf-space-dialog'))return;
    const dialog=document.createElement('dialog');dialog.className='hf-space-dialog';dialog.setAttribute('aria-label','Create a project space');
    dialog.innerHTML='<form method="dialog"><span class="hf-eyebrow">ROOM FOR AN IDEA</span><h2>A space of your own.</h2><label>Space name<input name="space" maxlength="40" required placeholder="A new project" autocomplete="off"></label><div><button type="button" data-cancel>Cancel</button><button type="submit">Create space</button></div><p class="hf-caption" role="status"></p></form>';
    os.append(dialog);dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{dialog.remove();newSpaceButton.focus({preventScroll:true});});
    dialog.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const name=dialog.querySelector('input').value.trim();if(!name)return;if(state.projects.length>=12){dialog.querySelector('[role=status]').textContent='You can keep up to 12 custom spaces in this browser.';return;}const id='space-'+crypto.randomUUID();state.projects.push({id,name});spaces[id]={x:0,y:0,name};renderSpaces();dialog.close();visitSpace(id);});dialog.showModal();
  }
  function rememberZoomSpace(p){if(state.desk.view!=='overview')return;const r=deskStage.getBoundingClientRect(),x=r.left+r.width/2+p.x,y=r.top+r.height/2+p.y;const target=[...orbitMap.children].find(b=>{const a=b.getBoundingClientRect();return x>=a.left-24&&x<=a.right+24&&y>=a.top-24&&y<=a.bottom+24;});zoomSpace=target?.dataset.space||null;}
  function settleWorkspaceZoom(){if(drawerOpen)return;const c=currentDeskView();if(state.desk.view!=='overview'&&c.tz<=.57){Object.assign(c,{x:0,y:0,z:1,tx:0,ty:0,tz:1});visitSpace('overview');}else if(state.desk.view==='overview'&&c.tz>=1.5&&zoomSpace){const id=zoomSpace;zoomSpace=null;Object.assign(c,{x:0,y:0,z:1,tx:0,ty:0,tz:1});visitSpace(id);}}
  function focusWorkspace(p){if(state.desk.view==='overview'){rememberZoomSpace(p);if(zoomSpace){visitSpace(zoomSpace);zoomSpace=null;return;}}const c=currentDeskView();setDeskView({x:c.tx-p.x*.14,y:c.ty-p.y*.14,z:Math.min(1.4,c.tz*1.055)});save();}

  function pinApp(name){
    if(!apps.some(a=>a.name===name))return null;const id='app-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-');let f=deskFiles.find(f=>f.id===id);if(f)return f;
    const space=state.desk.view==='overview'?'desk':state.desk.view;f={id,name,app:name,kind:'app',space,x:0,y:0,turn:0};deskFiles.push(f);state.appPins.push({name,space});state.desk.files[id]={space,x:0,y:0};state.desk.placements[id]={x:.3+(state.appPins.length%3)*.18,y:.35};attachDesktopFile(f);paintDesk();save();return f;
  }
  function pinFile(file){
    if(!file||typeof file.id!=='string'||typeof file.name!=='string')return false;
    const existing=deskFiles.find(f=>f.localId===file.id);if(existing){visitSpace(state.desk.files[existing.id].space);if(!window.HoleClusters?.revealItem(existing.id))existing.el.focus({preventScroll:true});return true;}
    const space=state.desk.view==='overview'?'desk':state.desk.view,kind=file.type?.startsWith('image/')?'photo':file.type?.startsWith('audio/')?'audio':file.type?.startsWith('text/')?'note':'folder';

  async function createSpaceFromTemplate({name,zones=[]}={}){
    if(typeof name!=='string'||!name.trim()||name.trim().length>40)throw new Error('Use a Space name of 1–40 characters.');
    if(state.projects.length>=12)throw new Error('You can keep up to 12 custom spaces in this browser.');
    if(!Array.isArray(zones)||zones.length>20||zones.some(z=>typeof z.name!=='string'||!z.name.trim()||z.name.length>80||!Number.isFinite(z.x)||!Number.isFinite(z.y)||Math.abs(z.x)>6000||Math.abs(z.y)>6000))throw new Error('Invalid Space template zones.');

  }
